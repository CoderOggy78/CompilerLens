# CompilerLens Configuration: Full Research Profile
# Executes on the complete dataset with maximum candidate fidelity and full evaluation.

name: "full"
seed: 42
device: "auto"

data:
  raw_dir: "data/raw"
  collection: "tile"
  backend: "xla"
  max_train_graphs: null  # All 5,709 graphs
  max_val_graphs: null    # All 676 graphs
  max_test_graphs: null   # All 844 graphs
  max_configs_per_graph: null  # All available configurations per graph
  val_ratio: 0.1
  fit_preprocessor_on_train_only: true
  num_workers: 4

model:
  type: "gnn_conditioned"
  node_feat_dim: 140
  config_feat_dim: 24
  num_opcodes: 128
  opcode_embed_dim: 32
  hidden_dim: 128
  num_layers: 3
  dropout: 0.1
  conditioning: "film"
  bidirectional: true

training:
  batch_size: 8
  num_epochs: 30
  learning_rate: 0.001
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  lambda_rank: 1.0
  huber_delta: 1.0
  tie_threshold: 1.0e-4
  max_pairs_per_graph: 512
  early_stopping_patience: 7
  checkpoint_dir: "checkpoints/full"
  log_interval: 10

evaluation:
  top_k_list: [1, 5, 10]
  bootstrap_rounds: 1000
  export_predictions: true
