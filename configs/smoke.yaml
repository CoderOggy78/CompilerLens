# CompilerLens Configuration: Smoke Profile
# Designed for rapid end-to-end integration testing and verification on real data.

name: "smoke"
seed: 42
device: "auto"  # "cuda", "mps", "cpu", or "auto"

data:
  raw_dir: "data/raw"
  collection: "tile"
  backend: "xla"
  max_train_graphs: 12
  max_val_graphs: 6
  max_test_graphs: 6
  max_configs_per_graph: 32
  val_ratio: 0.2
  fit_preprocessor_on_train_only: true
  num_workers: 0

model:
  type: "gnn_conditioned"
  node_feat_dim: 140
  config_feat_dim: 24
  num_opcodes: 128
  opcode_embed_dim: 32
  hidden_dim: 64
  num_layers: 2
  dropout: 0.1
  conditioning: "film"  # "film" or "concat"
  bidirectional: true

training:
  batch_size: 2  # Number of graphs per batch
  num_epochs: 3
  learning_rate: 0.001
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  lambda_rank: 1.0
  huber_delta: 1.0
  tie_threshold: 1.0e-4
  max_pairs_per_graph: 128
  early_stopping_patience: 3
  checkpoint_dir: "checkpoints/smoke"
  log_interval: 1

evaluation:
  top_k_list: [1, 5, 10]
  bootstrap_rounds: 200
  export_predictions: true
